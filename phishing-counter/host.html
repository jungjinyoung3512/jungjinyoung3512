<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07060C">
<meta name="robots" content="noindex, nofollow">
<title>보이스피싱 역관광 챌린지 · 진행자 | 강연 크리에이터 · 정진영</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🕵️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;min-width:0}
  :root{
    --bg:#07060C; --bg2:#0D0B15; --panel:#141221; --panel2:#1B1830;
    --line:rgba(255,214,74,.16); --line2:rgba(255,214,74,.34);
    --gold:#FFD64A; --gold2:#FFE9A3; --amber:#FFB020;
    --ok:#34F5A8; --bad:#FF5C6E; --sky:#6FC3FF; --violet:#B49BFF;
    --text:#F7F4EA; --muted:#A9A4B8; --dim:#6F6A80;
    --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    --serif:'Noto Serif KR',Georgia,serif;
  }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#040307}
  body{
    background:
      radial-gradient(1200px 620px at 14% -16%, rgba(255,214,74,.13), transparent 62%),
      radial-gradient(1000px 560px at 96% 112%, rgba(180,155,255,.09), transparent 66%),
      var(--bg);
    color:var(--text);font-family:var(--sans);letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;word-break:keep-all;
  }
  button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;touch-action:manipulation}
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column}

  /* ── 상단 ── */
  .top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:9px clamp(12px,1.5vw,22px);background:rgba(9,7,14,.88);backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,214,74,.12)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .bl{font-size:clamp(17px,1.5vw,22px);line-height:1}
  .brand b{display:block;font-size:clamp(12.5px,1.1vw,15px);font-weight:900;letter-spacing:-.4px;white-space:nowrap}
  .brand small{display:block;font-size:9px;letter-spacing:.15em;color:var(--dim);margin-top:2px;white-space:nowrap}
  .hright{display:flex;align-items:center;gap:7px;flex:none}
  .chip{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.05em;color:var(--muted);
    border:1px solid var(--line);background:rgba(255,214,74,.055);padding:6px 10px;border-radius:999px;white-space:nowrap}
  .chip b{color:var(--gold);font-weight:900;letter-spacing:.09em}
  .chip i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px rgba(52,245,168,.9);flex:none}
  .chip.off i{background:#6B7280;box-shadow:none}
  .hbtn{font-size:11px;font-weight:900;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,214,74,.07);color:var(--gold2);white-space:nowrap}
  .hbtn:active{transform:scale(.97)}

  /* ── 스테이지 ── */
  .stage{flex:1;display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);gap:clamp(10px,1.2vw,18px);
    padding:clamp(10px,1.2vw,18px);min-height:0}
  .col{min-height:0;display:flex;flex-direction:column;gap:10px}

  .roundBar{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .rno{font-size:10.5px;font-weight:900;letter-spacing:.18em;color:var(--amber)}
  .rtitle{font-family:var(--serif);font-size:clamp(15px,1.5vw,20px);font-weight:900;letter-spacing:-.035em}
  .dots{display:flex;gap:5px;margin-left:auto}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16)}
  .dot.done{background:var(--ok);border-color:transparent;box-shadow:0 0 8px rgba(52,245,168,.7)}
  .dot.now{background:var(--gold);border-color:transparent;box-shadow:0 0 9px rgba(255,214,74,.85)}

  /* 폰 미리보기 */
  .phone{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;
    border:1px solid rgba(255,255,255,.13);background:#0F0E16;box-shadow:0 26px 60px -40px #000}
  .chatTop{flex:none;display:flex;align-items:center;gap:11px;padding:11px 14px;background:#1B1B24;border-bottom:1px solid rgba(255,255,255,.07)}
  .avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;
    background:linear-gradient(150deg,#2C2B3A,#191825);border:1px solid rgba(255,255,255,.12)}
  .who{flex:1;min-width:0}
  .who b{display:block;font-size:clamp(13px,1.2vw,16px);font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who small{display:block;font-size:10px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .warnPill{font-size:9.5px;font-weight:900;letter-spacing:.08em;color:#FFD2D6;background:rgba(255,92,110,.16);
    border:1px solid rgba(255,92,110,.36);padding:5px 8px;border-radius:6px;flex:none}
  .chatBody{flex:1;overflow:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  .bubble{max-width:86%;padding:12px 15px;border-radius:16px 16px 16px 4px;font-size:clamp(14px,1.35vw,19px);line-height:1.48;
    font-weight:700;background:#26252F;color:#F4F0E7;border:1px solid rgba(255,255,255,.07);
    animation:bpop .3s cubic-bezier(.2,.9,.3,1) both}
  .bubble.link{color:#8FD0FF;text-decoration:underline}
  @keyframes bpop{from{opacity:0;transform:translateY(9px) scale(.98)}to{opacity:1;transform:none}}
  .bubble.typing{width:64px;padding:14px 16px;display:flex;gap:5px;align-items:center;justify-content:center}
  .bubble.typing i{width:7px;height:7px;border-radius:50%;background:#8E8798;animation:blink 1.1s infinite}
  .bubble.typing i:nth-child(2){animation-delay:.18s}
  .bubble.typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  .answers{flex:none;display:flex;gap:8px;margin-top:2px}
  .ans{flex:1;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);
    padding:9px 10px;font-size:11px;line-height:1.42;font-weight:800;color:#CFC9BC;position:relative}
  .ans span{display:block;font-size:9.5px;letter-spacing:.06em;font-weight:900;margin-bottom:3px;opacity:.85}
  .ans.n{border-color:rgba(255,92,110,.32);background:rgba(255,92,110,.07);color:#FFC9CE}
  .ans.s{border-color:rgba(111,195,255,.3);background:rgba(111,195,255,.07);color:#C9E8FF}
  .ans.d{border-color:rgba(255,214,74,.34);background:rgba(255,214,74,.08);color:#FFEDB8}

  .tipStrip{flex:none;border:1px solid rgba(52,245,168,.24);background:linear-gradient(180deg,rgba(52,245,168,.1),rgba(52,245,168,.03));
    border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
  .tipStrip .ti{font-size:18px;line-height:1.2;flex:none}
  .tipStrip b{display:block;font-size:10px;letter-spacing:.16em;color:var(--ok);margin-bottom:4px}
  .tipStrip p{margin:0;font-size:clamp(11.5px,1.05vw,14px);line-height:1.6;font-weight:700;color:#D9F7EA}

  /* ── 오른쪽 패널 ── */
  .panel{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:22px;
    background:linear-gradient(180deg,rgba(27,24,48,.9),rgba(20,18,33,.94));padding:clamp(12px,1.2vw,18px);
    box-shadow:0 26px 60px -44px #000;display:flex;flex-direction:column;gap:12px}
  .panelHead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
  .panelHead h3{margin:0;font-size:11px;font-weight:900;letter-spacing:.18em;color:var(--amber)}
  .badge{font-size:10px;font-weight:900;letter-spacing:.05em;padding:4px 8px;border-radius:999px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:var(--muted)}

  .lockBox{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:6px 4px}
  .lockIcon{font-size:44px;line-height:1;filter:drop-shadow(0 10px 24px rgba(255,214,74,.35))}
  .lockTitle{font-family:var(--serif);font-size:clamp(17px,1.7vw,22px);font-weight:900;letter-spacing:-.03em;margin:0}
  .lockMsg{font-size:clamp(11px,1vw,13px);line-height:1.7;color:var(--muted);margin:0;font-weight:600}
  .bigCount{display:flex;align-items:baseline;gap:6px;margin:6px 0 0}
  .bigCount b{font-size:clamp(38px,4.4vw,58px);font-weight:900;letter-spacing:-.05em;line-height:1;color:var(--gold)}
  .bigCount span{font-size:12px;font-weight:800;color:var(--muted)}
  .joinList{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px;max-height:22vh;overflow:auto}
  .jchip{font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);color:#D8D3E4}
  .startHint{font-size:10.5px;color:var(--dim);font-weight:700;margin-top:4px}

  /* 결과 */
  .hpWrap{flex:none;border:1px solid rgba(255,92,110,.26);background:rgba(255,92,110,.06);border-radius:16px;padding:11px 13px}
  .hpTop{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
  .hpTop b{font-size:10.5px;letter-spacing:.14em;color:#FFB9C0;font-weight:900}
  .hpTop span{font-size:11px;font-weight:900;color:#FF8E99;font-variant-numeric:tabular-nums}
  .hpBar{height:12px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden;position:relative}
  .hpFill{height:100%;width:34%;border-radius:999px;background:linear-gradient(90deg,#FF5C6E,#FFB020,#FFD64A);
    transition:width .9s cubic-bezier(.2,.9,.3,1)}
  .hpWrap.boom .hpFill{background:linear-gradient(90deg,#FFD64A,#FFFFFF,#FF5C6E);animation:pulse .7s infinite}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}

  .react{flex:none;position:relative;border:1px solid rgba(255,214,74,.24);border-radius:18px;padding:13px 14px;
    background:linear-gradient(180deg,rgba(255,214,74,.1),rgba(20,18,33,.6));animation:popIn .4s cubic-bezier(.2,.9,.3,1) both}
  @keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  .react .rq{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--amber);margin-bottom:6px}
  .react p{margin:0;font-size:clamp(13.5px,1.3vw,17.5px);line-height:1.5;font-weight:900;letter-spacing:-.02em;color:#FFF6D8}
  .react .rsub{margin-top:6px;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:0}

  .bars{flex:none;display:flex;flex-direction:column;gap:8px}
  .bar{display:flex;align-items:center;gap:8px}
  .bar .bl{width:66px;flex:none;font-size:11px;font-weight:900;letter-spacing:-.02em}
  .bar .track{flex:1;height:20px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
  .bar .fill{height:100%;width:0;border-radius:8px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
  .bar .num{width:56px;flex:none;text-align:right;font-size:11.5px;font-weight:900;font-variant-numeric:tabular-nums}
  .bar.n .bl{color:#FFB9C0} .bar.n .fill{background:linear-gradient(90deg,#FF5C6E,#FF7C8B)} .bar.n .num{color:#FFB9C0}
  .bar.s .bl{color:#A9DDFF} .bar.s .fill{background:linear-gradient(90deg,#3E9BD6,#6FC3FF)} .bar.s .num{color:#A9DDFF}
  .bar.d .bl{color:#FFE9A3} .bar.d .fill{background:linear-gradient(90deg,#FFB020,#FFD64A)} .bar.d .num{color:#FFE9A3}

  .damage{flex:none;display:flex;gap:8px}
  .dmg{flex:1;border-radius:14px;padding:10px 11px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035)}
  .dmg span{display:block;font-size:9.5px;font-weight:900;letter-spacing:.1em;color:var(--dim);margin-bottom:4px}
  .dmg b{font-size:clamp(14px,1.35vw,19px);font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .dmg.bad b{color:#FF8E99}
  .dmg.good b{color:var(--ok)}

  .rank{flex:none}
  .rank h4{margin:0 0 7px;font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--amber)}
  .rk{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);margin-bottom:5px}
  .rk .medal{font-size:15px;width:22px;text-align:center;flex:none}
  .rk .nm{flex:1;font-size:12px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk .am{font-size:11.5px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;flex:none}
  .rk.top1{background:linear-gradient(90deg,rgba(255,214,74,.16),rgba(255,214,74,.04));border-color:rgba(255,214,74,.34)}
  .empty{font-size:11px;color:var(--dim);font-weight:700;text-align:center;padding:10px 0}

  /* 최종 */
  .finalWrap{flex:1;display:flex;flex-direction:column;gap:11px;min-height:0}
  .finalTop{text-align:center;flex:none}
  .finalTop .tr{font-size:46px;line-height:1;filter:drop-shadow(0 12px 28px rgba(255,214,74,.45))}
  .finalTop h2{font-family:var(--serif);font-size:clamp(19px,2vw,26px);font-weight:900;letter-spacing:-.04em;margin:8px 0 4px}
  .finalTop p{margin:0;font-size:11.5px;color:var(--muted);font-weight:700}
  .winner{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:16px;margin-bottom:7px;
    background:linear-gradient(90deg,rgba(255,214,74,.18),rgba(255,214,74,.04));border:1px solid rgba(255,214,74,.34)}
  .winner .wm{font-size:24px;flex:none}
  .winner .wn{flex:1;min-width:0}
  .winner .wn b{display:block;font-size:clamp(14px,1.4vw,18px);font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .winner .wn small{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-top:2px}
  .winner .wa{font-size:clamp(15px,1.5vw,20px);font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}

  /* ── 하단 버튼 ── */
  .dock{flex:none;display:flex;gap:8px;padding:10px clamp(12px,1.4vw,20px) calc(10px + env(safe-area-inset-bottom));
    background:rgba(9,7,14,.92);backdrop-filter:blur(14px);border-top:1px solid rgba(255,214,74,.12)}
  .btn{flex:1;height:clamp(46px,5.2vh,58px);border-radius:15px;font-size:clamp(12px,1.15vw,15px);font-weight:900;letter-spacing:-.02em;
    background:linear-gradient(180deg,#232038,#191627);border:1px solid rgba(255,255,255,.13);color:#E9E3F2;
    display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s ease,filter .2s ease}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.36;filter:grayscale(.6);cursor:default}
  .btn.go{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#14120A;border-color:transparent;
    box-shadow:0 14px 30px -18px rgba(255,214,74,.9)}
  .btn.reveal{background:linear-gradient(180deg,#5CE8B0,#22C88A);color:#04150E;border-color:transparent;
    box-shadow:0 14px 30px -18px rgba(52,245,168,.8)}
  .btn.next{background:linear-gradient(180deg,#8FCBFF,#3E9BD6);color:#04121C;border-color:transparent}
  .btn.warn{background:linear-gradient(180deg,#3A2733,#2A1E27);color:#FFB9C0;border-color:rgba(255,92,110,.34)}
  .btn.armed{background:linear-gradient(180deg,#FF5C6E,#D63A4C);color:#fff;border-color:transparent}
  .btn.ghost{flex:.62}
  .btn .k{font-size:9px;opacity:.6;font-weight:800}

  /* ── 모달 ── */
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(4,3,8,.82);backdrop-filter:blur(6px)}
  .modal.on{display:flex}
  .mbox{width:min(880px,96vw);max-height:88vh;overflow:auto;border-radius:24px;border:1px solid var(--line);
    background:linear-gradient(180deg,#1B1830,#121021);padding:20px;box-shadow:0 40px 90px -50px #000}
  .mbox h3{margin:0 0 4px;font-family:var(--serif);font-size:20px;font-weight:900;letter-spacing:-.03em}
  .mbox .msub{margin:0 0 14px;font-size:11.5px;color:var(--muted);font-weight:700}
  .qrBox{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  .qrImg{width:min(300px,52vh);height:auto;border-radius:20px;background:#fff;padding:14px;box-shadow:0 20px 50px -28px #000}
  .qrUrl{font-size:12.5px;font-weight:800;color:var(--gold2);word-break:break-all}
  .qrSub{font-size:11.5px;color:var(--muted);font-weight:700}
  .qrSteps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .qrSteps span{font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);color:#D8D3E4}

  .editGrid{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px}
  .tabs{display:flex;flex-direction:column;gap:6px}
  .tab{text-align:left;padding:9px 11px;border-radius:11px;font-size:11.5px;font-weight:800;letter-spacing:-.02em;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#CFC9BC}
  .tab.on{background:rgba(255,214,74,.13);border-color:var(--line2);color:#FFF3CF}
  .field{margin-bottom:9px}
  .field label{display:block;font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--dim);margin-bottom:4px}
  .field input,.field textarea{width:100%;background:#0D0B15;border:1px solid rgba(255,255,255,.14);border-radius:10px;
    color:#F2EEE3;font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 10px;outline:none;line-height:1.5}
  .field textarea{resize:vertical;min-height:70px}
  .field input:focus,.field textarea:focus{border-color:var(--gold)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
  .mbtn{padding:10px 16px;border-radius:12px;font-size:12px;font-weight:900;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);color:#E9E3F2}
  .mbtn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#14120A;border-color:transparent}
  .mbtn.danger{background:rgba(255,92,110,.14);border-color:rgba(255,92,110,.4);color:#FFB9C0}

  .toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);z-index:80;padding:11px 18px;border-radius:999px;
    font-size:12.5px;font-weight:800;background:rgba(255,214,74,.96);color:#15130A;opacity:0;pointer-events:none;
    transition:opacity .22s ease,transform .22s ease;box-shadow:0 16px 40px -22px rgba(0,0,0,.9)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .boomfx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:16px}
  .boomfx i{position:absolute;font-size:18px;animation:fly .9s ease-out forwards}
  @keyframes fly{from{opacity:1;transform:translate(0,0) scale(.7)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="bl">🕵️‍♂️</span>

  const START_ASSET = 100000000;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function fmtWon(n){
    n = Math.max(0, Math.round(Number(n) || 0));
    if(n === 0) return "0원";
    const eok = Math.floor(n / 1e8), man = Math.round((n % 1e8) / 1e4);
    let out = "";
    if(eok) out += eok.toLocaleString("ko-KR") + "억";
    if(man) out += (out ? " " : "") + man.toLocaleString("ko-KR") + "만";
    return out + "원";
  }

  const DEFAULTS = JSON.parse(JSON.stringify(window.PC_DEFAULT_SCENARIOS || []));
  function normScen(v){
    if(!Array.isArray(v) || !v.length) return null;
    return v.map(s => ({
      id: String(s.id || "s"),
      icon: String(s.icon || "📱"),
      sender: String(s.sender || "발신자"),
      senderNote: String(s.senderNote || ""),
      title: String(s.title || "시나리오"),
      msgs: Array.isArray(s.msgs) ? s.msgs.map(String) : [],
      tip: String(s.tip || ""),
      run: String(s.run || ""),
      patience: String(s.patience || ""),
      jackpot: String(s.jackpot || ""),
      options: Array.isArray(s.options) ? s.options.map(o => ({
        t: ["naive","stall","destroy"].includes(o.t) ? o.t : "stall",
        label: String(o.label || ""), sub: String(o.sub || "")
      })) : [],
      bonus: Number(s.bonus) || 0,
      bonusLabel: String(s.bonusLabel || "")
    }));
  }
  let scenarios = normScen(DEFAULTS) || [];
  let state = { open:false, sidx:0, reveal:false, finished:false };
  let players = {};
  let choices = {};
  let db = null, seeded = false, sndOn = true;
  let lastChatKey = "";
  const TYPES = { naive:{k:"😇", nm:"속아줌", cls:"n"}, stall:{k:"😎", nm:"방어", cls:"s"}, destroy:{k:"🔥", nm:"역관광", cls:"d"} };

  $("roomChip").textContent = ROOM;
  $("qrRoom").textContent = ROOM;
  $("qrUrl").textContent = AUD_URL;

  /* ══════════ 사운드 ══════════ */
  const Snd = (function(){
    let ctx = null, master = null, bgmGain = null, bgmTimer = null, started = false;
    function ac(){
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      }
      if(ctx.state === "suspended") ctx.resume();
      return ctx;
    }
    function tone(freq, dur, type, gain, when, slideTo){
      const c = ac(); if(!c) return;
      const t0 = c.currentTime + (when || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t0);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain || .18, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + .05);
    }
    function startBgm(){
      const c = ac(); if(!c || started) return;
      started = true;
      bgmGain = c.createGain(); bgmGain.gain.value = 0.0001; bgmGain.connect(master);
      bgmGain.gain.linearRampToValueAtTime(sndOn ? .05 : .0001, c.currentTime + .6);
      const o1 = c.createOscillator(); o1.type = "sine"; o1.frequency.value = 55;
      const o2 = c.createOscillator(); o2.type = "triangle"; o2.frequency.value = 82.5;
      const lfo = c.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 0.18;
      const lg = c.createGain(); lg.gain.value = .022;
      lfo.connect(lg); lg.connect(bgmGain.gain);
      o1.connect(bgmGain); o2.connect(bgmGain);
      o1.start(); o2.start(); lfo.start();
      bgmTimer = setInterval(() => {
        if(!sndOn) return;
        tone(880, .09, "sine", .035, 0);
        tone(1320, .07, "sine", .022, .12);
      }, 4200);
    }
    function setOn(v){
      sndOn = v;
      if(bgmGain && ctx) bgmGain.gain.linearRampToValueAtTime(v ? .05 : .0001, ctx.currentTime + .25);
    }
    function ding(){ tone(1046, .16, "sine", .2, 0); tone(1568, .22, "sine", .13, .1); }
    function tick(){ tone(560, .06, "square", .05, 0); }
    function fanfare(){
      [523,659,784,1046,1318].forEach((f,i) => tone(f, .3, "triangle", .16, i*.09));
      [1046,1318,1568].forEach((f,i) => tone(f, .5, "sine", .09, .5 + i*.05));
    }
    function alarm(){
      for(let i=0;i<3;i++){
        tone(720, .22, "square", .1, i*.46, 980);
        tone(980, .22, "square", .1, i*.46+.24, 720);
      }
    }
    function boom(){ tone(120, .5, "sawtooth", .16, 0, 40); }
    return { startBgm, setOn, ding, tick, fanfare, alarm, boom, get on(){ return sndOn; } };
  })();

  function toast(msg){
    const t = $("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(t._tm);
    t._tm = setTimeout(() => t.classList.remove("on"), 2200);
  }

  /* ══════════ Firebase ══════════ */
  function initFB(){
    if(typeof firebase === "undefined" || !firebase.initializeApp){
      $("netChip").innerHTML = "<i></i>연결 실패"; toast("실시간 연결 실패 · 새로고침해 주세요"); return;
    }
    firebase.initializeApp(FB_CONFIG);
    db = firebase.database();
    db.ref(".info/connected").on("value", s => {
      const ok = !!s.val();
      $("netChip").classList.toggle("off", !ok);
      $("netChip").innerHTML = ok ? "<i></i>실시간 연결" : "<i></i>연결 중";
    });

    db.ref(BASE + "/scenarios").on("value", s => {
      const arr = normScen(s.val());
      if(arr) scenarios = arr;
      else if(!seeded){ seeded = true; db.ref(BASE + "/scenarios").set(scenarios).catch(()=>{}); }
      render();
    });

    db.ref(BASE + "/state").on("value", s => {
      const v = s.val();
      if(!v){
        state = { open:false, sidx:0, reveal:false, finished:false };
        db.ref(BASE + "/state").set({ open:false, sidx:0, reveal:false, finished:false, ts:Date.now() }).catch(()=>{});
      } else {
        state = { open:!!v.open, sidx:Number(v.sidx)||0, reveal:!!v.reveal, finished:!!v.finished };
      }
      render();
    });

    db.ref(BASE + "/players").on("value", s => { players = s.val() || {}; render(); });

    db.ref(BASE + "/choices").on("value", s => { choices = s.val() || {}; render(); });
  }

  function setState(patch){
    state = Object.assign({}, state, patch);
    render();
    if(!db){ toast("연결을 기다리는 중입니다"); return; }
    db.ref(BASE + "/state").update(Object.assign({ ts: Date.now() }, patch))
      .catch(() => toast("저장 실패 · 연결을 확인해 주세요"));
  }

  /* ══════════ 계산 ══════════ */
  function scenAt(i){ return (i >= 0 && i < scenarios.length) ? scenarios[i] : null; }
  function currentScen(){ return scenAt(state.sidx); }
  function playerList(){
    return Object.keys(players).map(k => Object.assign({ pid:k }, players[k]))
      .filter(p => p && p.name);
  }
  function roundChoices(sid){
    const o = (choices && choices[sid]) || {};
    const list = Object.keys(o).map(k => Object.assign({ pid:k }, o[k]));
    const c = { naive:0, stall:0, destroy:0, n:list.length, lost:0, gain:0, list:list };
    list.forEach(x => {
      if(c[x.t] != null) c[x.t]++;
      c.lost += Number(x.lost) || 0;
      c.gain += Number(x.gain) || 0;
    });
    return c;
  }
  function topPlayers(n){
    return playerList().sort((a,b) => (Number(b.asset)||0) - (Number(a.asset)||0)).slice(0, n || 3);
  }

  /* ══════════ 렌더 ══════════ */
  function render(){
    renderHeader();
    renderLeft();
    renderPanel();
    renderDock();
  }

  function renderHeader(){
    $("pcount").textContent = playerList().length;
  }

  function renderLeft(){
    const sc = currentScen();
    const total = scenarios.length || 5;
    $("rno").textContent = "SCENARIO " + Math.min(state.sidx + 1, total) + " / " + total;
    $("dots").innerHTML = scenarios.map((s, i) => {
      let cls = "dot";
      if(i < state.sidx || (state.finished)) cls += " done";
      else if(i === state.sidx) cls += " now";
      return '<span class="' + cls + '"></span>';
    }).join("");

    if(!sc){
      $("rtitle").textContent = "수사 종료";
      $("chatBody").innerHTML = '<div class="bubble">🕵️ 모든 시나리오가 끝났습니다. 수고하셨습니다!</div>';
      $("answers").innerHTML = "";
      $("tipStrip").style.display = "none";
      return;
    }
    $("rtitle").textContent = sc.title;
    $("chatAvatar").textContent = sc.icon;
    $("chatWho").textContent = sc.sender;
    $("chatNote").textContent = sc.senderNote || "문자";
    const key = sc.id + "|" + state.sidx;
    if(lastChatKey !== key){
      lastChatKey = key;
      const body = $("chatBody");
      body.innerHTML = "";
      sc.msgs.forEach((m, i) => {
        const d = document.createElement("div");
        d.className = "bubble" + (/https?:\/\//.test(m) ? " link" : "");
        d.textContent = m;
        d.style.animationDelay = (i * .16) + "s";
        body.appendChild(d);
      });
      const a = $("answers");
      a.innerHTML = "";
      sc.options.forEach(o => {
        const d = document.createElement("div");
        d.className = "ans " + (TYPES[o.t] ? TYPES[o.t].cls : "s");
        d.innerHTML = '<span>' + esc((TYPES[o.t] ? TYPES[o.t].k + " " + TYPES[o.t].nm : "")) + '</span>' + esc(o.label);
        a.appendChild(d);
      });
    }
    const showTip = state.reveal || state.finished;
    $("tipStrip").style.display = showTip && sc.tip ? "flex" : "none";
    $("tipText").textContent = sc.tip || "";
  }

  function renderPanel(){
    const panel = $("panel");
    if(state.finished){ panel.innerHTML = finalHTML(); return; }
    const sc = currentScen();
    if(!sc){ panel.innerHTML = ""; return; }
    if(state.reveal) panel.innerHTML = revealHTML(sc);
    else panel.innerHTML = preHTML(sc);
    // 애니메이션 값 적용
    if(state.reveal){
      requestAnimationFrame(() => {
        const c = roundChoices(sc.id);
        const max = Math.max(1, c.naive, c.stall, c.destroy);
        ["n","s","d"].forEach(k => {
          const el = panel.querySelector('.bar.' + k + ' .fill');
          if(el) el.style.width = Math.round((c[k === "n" ? "naive" : k === "s" ? "stall" : "destroy"] / max) * 100) + "%";
        });
        const total = Math.max(1, c.n);
        const hp = panel.querySelector('.hpFill');
        if(hp) hp.style.width = Math.min(100, 30 + (c.destroy / total) * 78) + "%";
      });
    }
  }

  function preHTML(sc){
    const pl = playerList();
    const names = pl.slice(0, 42).map(p => '<span class="jchip">' + esc(p.name) + '</span>').join("");
    const more = pl.length > 42 ? '<span class="jchip">+' + (pl.length - 42) + '</span>' : "";
    return '' +
      '<div class="panelHead"><h3>LIVE STATUS</h3><span class="badge">🔒 결과 잠금</span></div>' +
      '<div class="bigCount"><b>' + pl.length + '</b><span>명 입장</span></div>' +
      '<div class="joinList">' + (names || '<span class="jchip">아직 없음</span>') + more + '</div>' +
      '<div class="lockBox">' +
        '<div class="lockIcon">🔒</div>' +
        '<p class="lockTitle">' + (state.open ? "선택이 진행 중입니다" : "시나리오를 여세요") + '</p>' +
        '<p class="lockMsg">' + (state.open
          ? "청중이 고르는 동안 결과는 보이지 않습니다.<br>다 고르면 <b style=\"color:#5CE8B0\">🏆 결과보기</b>를 누르세요."
          : "하단의 <b style=\"color:#FFD64A\">▶ 시나리오 시작</b>을 누르면<br>모든 청중 폰에 사기꾼의 문자가 도착합니다.") + '</p>' +
        '<p class="startHint">' + (state.open ? "재촉하지 말고 30초쯤 기다려 주세요" : "QR로 먼저 입장시켜 주세요") + '</p>' +
      '</div>';
  }

  function revealHTML(sc){
    const c = roundChoices(sc.id);
    const total = Math.max(1, c.n);
    const pc = k => Math.round((c[k] / total) * 100);
    const dom = (c.destroy >= c.naive && c.destroy >= c.stall && c.destroy > 0) ? "destroy"
              : (c.naive > c.stall ? "naive" : (c.stall > 0 ? "stall" : "none"));
    let line = "아직 아무도 선택하지 않았습니다.";
    let sub = "참가자를 기다려 주세요.";
    if(c.n > 0){
      if(dom === "destroy"){ line = sc.run || "사기꾼 : \"이, 이건 사기가 아니라는데…?!\""; sub = "🔥 역관광 우세 · 사기꾼이 줄행랑 칩니다"; }
      else if(dom === "naive"){ line = sc.jackpot || "사기꾼 : \"오늘 대박! 다음 타자!\""; sub = "😇 속은 사람이 더 많습니다 · 예방법을 꼭 짚어 주세요"; }
      else { line = sc.patience || "사기꾼 : \"아… 그, 그게 아니라…\" (말문 막힘)"; sub = "😎 방어 우세 · 사기꾼 혈압만 올라갑니다"; }
    }
    const top = topPlayers(3);
    const medal = ["🥇","🥈","🥉"];
    const rankHTML = top.length
      ? top.map((p,i) => '<div class="rk' + (i===0?' top1':'') + '"><span class="medal">' + medal[i] + '</span>' +
          '<span class="nm">' + esc(p.name) + '</span><span class="am">' + fmtWon(p.asset) + '</span></div>').join("")
      : '<div class="empty">참가자가 없습니다</div>';

    const hpVal = Math.min(200, 120 + c.destroy * 30 + c.stall * 15);
    return '' +
      '<div class="panelHead"><h3>ROUND RESULT</h3><span class="badge" style="color:#5CE8B0;border-color:rgba(52,245,168,.4)">공개 중</span></div>' +
      '<div class="hpWrap' + (c.destroy > 0 ? ' boom' : '') + '">' +
        '<div class="hpTop"><b>🩺 사기꾼 혈압</b><span>' + hpVal + ' / 200' + (hpVal >= 200 ? ' 💥' : '') + '</span></div>' +
        '<div class="hpBar"><div class="hpFill" style="width:' + Math.min(100, hpVal/2) + '%"></div></div>' +
      '</div>' +
      '<div class="react"><div class="rq">SCAMMER REACTION</div><p>' + esc(line) + '</p><div class="rsub">' + esc(sub) + '</div></div>' +
      '<div class="bars">' +
        '<div class="bar n"><span class="bl">😇 속아줌</span><span class="track"><span class="fill" style="width:0"></span></span><span class="num">' + c.naive + '명 ' + pc("naive") + '%</span></div>' +
        '<div class="bar s"><span class="bl">😎 방어</span><span class="track"><span class="fill" style="width:0"></span></span><span class="num">' + c.stall + '명 ' + pc("stall") + '%</span></div>' +
        '<div class="bar d"><span class="bl">🔥 역관광</span><span class="track"><span class="fill" style="width:0"></span></span><span class="num">' + c.destroy + '명 ' + pc("destroy") + '%</span></div>' +
      '</div>' +
      '<div class="damage">' +
        '<div class="dmg bad"><span>사기꾼이 챙긴 돈</span><b>' + fmtWon(c.lost) + '</b></div>' +
        '<div class="dmg good"><span>청중이 받은 현상금</span><b>' + fmtWon(c.gain) + '</b></div>' +
      '</div>' +
      '<div class="rank"><h4>🏆 현재 퇴치왕 TOP 3</h4>' + rankHTML + '</div>';
  }

  function finalHTML(){
    const pl = playerList();
    const top = topPlayers(3);
    const medal = ["🥇","🥈","🥉"];
    const rows = top.length
      ? top.map((p,i) => '<div class="winner" style="' + (i===0?'':'background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.12)') + '">' +
          '<span class="wm">' + medal[i] + '</span>' +
          '<span class="wn"><b>' + esc(p.name) + '</b><small>🔥 역관광 ' + (Number(p.destroy)||0) + '회 · 😎 방어 ' + (Number(p.stall)||0) + '회 · 😇 당함 ' + (Number(p.naive)||0) + '회</small></span>' +
          '<span class="wa">' + fmtWon(p.asset) + '</span></div>').join("")
      : '<div class="empty">참가자가 없습니다</div>';
    const saved = pl.filter(p => (Number(p.naive)||0) === 0).length;
    return '' +
      '<div class="finalWrap">' +
        '<div class="finalTop"><div class="tr">🏆</div><h2>사기꾼 퇴치왕</h2>' +
          '<p>총 ' + pl.length + '명 참여 · 한 번도 안 속은 사람 ' + saved + '명</p></div>' +
        '<div>' + rows + '</div>' +
        '<div class="dmg good" style="margin-top:4px"><span>오늘 지켜낸 돈</span><b style="color:#5CE8B0">' +
          fmtWon(pl.reduce((s,p) => s + (Number(p.asset)||0), 0)) + '</b></div>' +
        '<div class="rank" style="margin-top:6px"><h4>📣 마무리 멘트</h4>' +
          '<p style="margin:0;font-size:12px;line-height:1.65;font-weight:700;color:#D8D3E4">"오늘 배운 한 가지만 기억하세요. <b style="color:#FFD64A">돈을 보내라는 전화·문자는 100% 사기</b>입니다. 끊고, 가족에게 말하고, 112에 전화하세요."</p></div>' +
      '</div>';
  }

  function renderDock(){
    const sc = currentScen();
    const last = state.sidx >= (scenarios.length - 1);
    $("btnStart").disabled = state.finished || (state.open && !state.reveal);
    $("btnReveal").disabled = state.finished || !state.open || state.reveal;
    $("btnNext").disabled = !state.reveal;
    $("btnNext").innerHTML = last ? "🏁 최종 시상" : "🔄 다음 시나리오";
    $("btnStart").textContent = state.open ? "▶ 진행 중" : "▶ 시나리오 시작";
    $("btnNext").classList.toggle("next", true);
    if(state.finished){
      $("btnNext").innerHTML = "🔄 처음부터";
      $("btnNext").disabled = false;
    }
    void sc;
  }

  /* ══════════ 액션 ══════════ */
  function startScenario(){
    Snd.startBgm();
    Snd.ding();
    setState({ open:true, reveal:false, finished:false });
    toast("시나리오 " + (state.sidx + 1) + " 시작 · 청중 폰을 확인하세요");
  }

  function reveal(){
    const sc = currentScen(); if(!sc) return;
    const c = roundChoices(sc.id);
    setState({ open:true, reveal:true });
    if(c.destroy > 0 && c.destroy >= c.naive){ Snd.fanfare(); Snd.boom(); }
    else if(c.naive > c.stall){ Snd.alarm(); }
    else { Snd.ding(); }
  }

  let clearArmed = false, clearTimer = null;
  function clearRoom(){
    const btn = $("btnClear");
    if(!clearArmed){
      clearArmed = true;
      btn.classList.add("armed");
      btn.textContent = "⚠️ 한 번 더 누르면 비웁니다";
      clearTimeout(clearTimer);
      clearTimer = setTimeout(() => {
        clearArmed = false; btn.classList.remove("armed"); btn.textContent = "🧹 참가자 비우기";
      }, 4000);
      return;
    }
    clearArmed = false; clearTimeout(clearTimer);
    btn.classList.remove("armed"); btn.textContent = "🧹 참가자 비우기";
    if(!db){ toast("연결을 기다리는 중입니다"); return; }
    db.ref(BASE + "/players").remove()
      .then(() => db.ref(BASE + "/choices").remove())
      .then(() => db.ref(BASE + "/state").update({ open:false, sidx:0, reveal:false, finished:false, ts:Date.now() }))
      .then(() => toast("참가자를 비웠습니다 · 새로 입장할 수 있어요"))
      .catch(() => toast("비우기 실패 · 다시 시도해 주세요"));
  }

  function nextScenario(){
    Snd.tick();
    const last = state.sidx >= (scenarios.length - 1);
    if(state.finished){
      setState({ open:false, sidx:0, reveal:false, finished:false });
      toast("처음으로 돌아왔습니다");
      return;
    }
    if(last){
      setState({ finished:true, open:false, reveal:false });
      Snd.fanfare();
      toast("수사 종료 · 퇴치왕을 발표하세요");
      return;
    }
    setState({ sidx: state.sidx + 1, reveal:false, open:true });
    toast("시나리오 " + (state.sidx + 1) + " 시작");
  }

  $("btnStart").addEventListener("click", startScenario);
  $("btnReveal").addEventListener("click", reveal);
  $("btnNext").addEventListener("click", nextScenario);
  $("btnClear").addEventListener("click", clearRoom);
  $("btnSound").addEventListener("click", () => {
    const on = !Snd.on;
    Snd.setOn(on);
    $("btnSound").textContent = on ? "🔊 소리 ON" : "🔇 음소거";
    if(on){ Snd.startBgm(); Snd.ding(); }
  });

  document.addEventListener("keydown", e => {
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key === " "){ e.preventDefault(); if(!$("btnReveal").disabled) reveal(); else if(!$("btnStart").disabled) startScenario(); }
    if(e.key === "ArrowRight" && !$("btnNext").disabled) nextScenario();
  });

  /* ══════════ 모달 ══════════ */
  function openModal(id){ $(id).classList.add("on"); }
  function closeModals(){ document.querySelectorAll(".modal").forEach(m => m.classList.remove("on")); }
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModals));
  document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if(e.target === m) closeModals(); }));
  document.addEventListener("keydown", e => { if(e.key === "Escape") closeModals(); });

  $("btnQR").addEventListener("click", () => {
    Snd.startBgm();
    const img = $("qrImg");
    if(QR_DATA && QR_DATA.indexOf("data:image") === 0) img.src = QR_DATA;
    else img.alt = "QR 준비 중";
    openModal("qrModal");
  });

  /* ══════════ 문제 편집 ══════════ */
  let draft = null, editIdx = 0;
  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  function renderEdit(){
    if(!draft) draft = clone(scenarios);
    $("editTabs").innerHTML = draft.map((s, i) =>
      '<button class="tab' + (i === editIdx ? ' on' : '') + '" data-tab="' + i + '">' + esc(s.icon) + ' ' + esc(s.title) + '</button>'
    ).join("");
    $("editTabs").querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
      collectEdit(); editIdx = Number(b.dataset.tab); renderEdit();
    }));
    const s = draft[editIdx];
    if(!s){ $("editFields").innerHTML = ""; return; }
    $("editFields").innerHTML =
      '<div class="two">' +
        '<div class="field"><label>아이콘</label><input id="fIcon" value="' + esc(s.icon) + '"></div>' +
        '<div class="field"><label>보낸 사람</label><input id="fSender" value="' + esc(s.sender) + '"></div>' +
      '</div>' +
      '<div class="two">' +
        '<div class="field"><label>발신 정보(작게)</label><input id="fNote" value="' + esc(s.senderNote) + '"></div>' +
        '<div class="field"><label>시나리오 제목</label><input id="fTitle" value="' + esc(s.title) + '"></div>' +
      '</div>' +
      '<div class="field"><label>사기꾼 메시지 (한 줄에 하나씩)</label><textarea id="fMsgs" rows="5">' + esc(s.msgs.join("\n")) + '</textarea></div>' +
      s.options.map((o, i) =>
        '<div class="field"><label>선택지 ' + (i+1) + ' · ' + (TYPES[o.t] ? TYPES[o.t].k + " " + TYPES[o.t].nm : "") + '</label>' +
        '<input id="fOpt' + i + '" value="' + esc(o.label) + '">' +
        '<input id="fSub' + i + '" style="margin-top:5px" value="' + esc(o.sub) + '" placeholder="설명(작게)"></div>'
      ).join("") +
      '<div class="field"><label>실제 예방법 1줄</label><input id="fTip" value="' + esc(s.tip) + '"></div>' +
      '<div class="two">' +
        '<div class="field"><label>역관광 현상금(만원)</label><input id="fBonus" type="number" value="' + Math.round((s.bonus||0)/10000) + '"></div>' +
        '<div class="field"><label>현상금 표기</label><input id="fBonusLabel" value="' + esc(s.bonusLabel) + '"></div>' +
      '</div>' +
      '<div class="field"><label>사기꾼 반응 · 역관광 우세</label><input id="fRun" value="' + esc(s.run) + '"></div>' +
      '<div class="field"><label>사기꾼 반응 · 방어 우세</label><input id="fPat" value="' + esc(s.patience) + '"></div>' +
      '<div class="field"><label>사기꾼 반응 · 속은 사람 우세</label><input id="fJack" value="' + esc(s.jackpot) + '"></div>';
  }

  function collectEdit(){
    if(!draft || !draft[editIdx]) return;
    const s = draft[editIdx];
    const g = id => { const el = $(id); return el ? el.value : ""; };
    if(!$("fTitle")) return;
    s.icon = g("fIcon").trim() || "📱";
    s.sender = g("fSender").trim() || "발신자";
    s.senderNote = g("fNote").trim();
    s.title = g("fTitle").trim() || "시나리오";
    s.msgs = g("fMsgs").split("\n").map(x => x.trim()).filter(Boolean);
    s.tip = g("fTip").trim();
    s.run = g("fRun").trim(); s.patience = g("fPat").trim(); s.jackpot = g("fJack").trim();
    s.bonus = Math.max(0, Math.round(Number(g("fBonus")) || 0)) * 10000;
    s.bonusLabel = g("fBonusLabel").trim();
    s.options = s.options.map((o, i) => ({
      t: o.t,
      label: (g("fOpt" + i) || o.label).trim(),
      sub: (g("fSub" + i) || "").trim()
    }));
  }

  $("btnEdit").addEventListener("click", () => {
    Snd.startBgm();
    draft = clone(scenarios); editIdx = 0;
    renderEdit(); openModal("editModal");
  });
  $("btnSaveScen").addEventListener("click", () => {
    collectEdit();
    const arr = normScen(draft);
    if(!arr){ toast("저장할 시나리오가 없습니다"); return; }
    if(!db){ toast("연결을 기다리는 중입니다"); return; }
    db.ref(BASE + "/scenarios").set(arr)
      .then(() => { toast("저장했습니다 · 청중 폰에 반영됩니다"); closeModals(); })
      .catch(() => toast("저장 실패 · 다시 시도해 주세요"));
  });
  $("btnRestore").addEventListener("click", () => {
    const arr = normScen(clone(DEFAULTS));
    if(!db){ toast("연결을 기다리는 중입니다"); return; }
    db.ref(BASE + "/scenarios").set(arr)
      .then(() => { draft = clone(DEFAULTS); editIdx = 0; renderEdit(); toast("기본값으로 복원했습니다"); })
      .catch(() => toast("복원 실패 · 다시 시도해 주세요"));
  });

  /* ══════════ 시작 ══════════ */
  draft = clone(scenarios);
  render();
  initFB();
})();
</script>
</body>
</html>
