<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🎈</text></svg>">
<title>오늘은 내가 주인공 | 강연 크리에이터 · 정진영</title>
<meta name="description" content="강연장 서바이벌 — 포수가 쏘는 풍선에서 끝까지 살아남는 사람이 오늘의 주인공!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#080E1B;--bg2:#0C1526;--panel:#131F36;--panel2:#182742;
    --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);
    --gold:#FBBF24;--gold2:#FDE68A;--amber:#F59E0B;
    --mint:#34D399;--cyan:#22D3EE;--rose:#FB7185;--red:#F87171;
    --text:#F1F5F9;--muted:#9AA9BF;--dim:#64748B;
    --sans:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --serif:"Noto Serif KR",Georgia,serif;
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  html{-webkit-text-size-adjust:100%;background:#050A14}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.45;
    letter-spacing:-0.01em;word-break:keep-all;-webkit-font-smoothing:antialiased;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;transition:background .6s ease;
    background:
      radial-gradient(120% 44% at 50% -8%, rgba(251,191,36,.16) 0%, rgba(251,191,36,0) 62%),
      radial-gradient(90% 40% at 50% 106%, rgba(34,211,238,.10) 0%, rgba(34,211,238,0) 70%);
  }
  body.live::before{
    background:
      radial-gradient(120% 56% at 50% -6%, rgba(251,191,36,.26) 0%, rgba(251,191,36,0) 64%),
      radial-gradient(90% 48% at 50% 106%, rgba(244,114,182,.14) 0%, rgba(244,114,182,0) 72%);
  }
  .app{
    position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto;
    height:100vh;height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 18px calc(env(safe-area-inset-bottom,0px) + 12px);
  }
  .topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 8px}
  .brand{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:#CBD5E1;min-width:0}
  .brand .b{font-size:15px}
  .brand .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.02em}
  .roomchip{
    flex:none;display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;
    font-weight:800;color:#93A4BC;background:rgba(255,255,255,.05);border:1px solid var(--line);
    padding:5px 9px;border-radius:99px;letter-spacing:.08em;
  }
  .roomchip b{color:var(--gold);letter-spacing:.1em}
  .views{flex:1;min-height:0;position:relative}
  .view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
  .view.on{display:flex;animation:fade .34s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ================= 입장 ================= */
  #vEntry{justify-content:center}
  .entry-card{
    border:1px solid var(--line);border-radius:24px;padding:24px 20px 20px;
    background:linear-gradient(170deg,rgba(251,191,36,.13),rgba(19,31,54,.94) 42%,rgba(9,16,29,.97));
    box-shadow:0 26px 60px -34px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .kicker{font-size:10px;font-weight:900;letter-spacing:.2em;color:var(--gold);text-align:center;margin-bottom:9px}
  .entry-card h1{
    font-family:var(--serif);font-size:27px;line-height:1.24;font-weight:900;letter-spacing:-.045em;
    margin:0 0 8px;text-align:center;
  }
  .entry-card h1 em{font-style:normal;color:var(--gold2)}
  .esub{font-size:12.5px;line-height:1.6;color:var(--muted);text-align:center;margin:0 0 18px}
  .esub b{color:#E2E8F0;font-weight:800}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:11px;font-weight:900;letter-spacing:.05em;color:#8FA0B8;margin:0 0 6px 3px}
  .inp{
    width:100%;height:52px;border-radius:14px;border:1px solid var(--line2);background:#0D1728;
    color:var(--text);font-family:inherit;font-size:17px;font-weight:800;letter-spacing:-.01em;
    padding:0 16px;outline:none;transition:border-color .16s,box-shadow .16s,background .16s;
  }
  .inp::placeholder{color:#4C5D77;font-weight:700}
  .inp:focus{border-color:rgba(251,191,36,.6);box-shadow:0 0 0 3px rgba(251,191,36,.13);background:#0F1B2E}
  .inp.room{font-family:var(--mono);letter-spacing:.22em;text-align:center;font-size:15px;height:44px}
  .inp.shake{animation:shakeX .38s}
  @keyframes shakeX{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .joinbtn{
    width:100%;height:56px;margin-top:8px;border:none;border-radius:16px;cursor:pointer;
    background:linear-gradient(180deg,#FDE68A,#F59E0B);color:#2A1A00;
    font-family:inherit;font-size:17px;font-weight:900;letter-spacing:-.02em;
    box-shadow:0 14px 30px -16px rgba(245,158,11,.9), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .1s,filter .15s;
  }
  .joinbtn:active{transform:scale(.985)}
  .joinbtn:disabled{filter:grayscale(.5) brightness(.8);cursor:not-allowed}
  .entry-foot{margin-top:13px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11.5px;font-weight:800;color:#7C8CA6}
  .entry-foot .dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 9px var(--mint);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .entry-foot b{color:var(--gold2);font-family:var(--mono);font-size:13px}
  .entry-foot i{font-style:normal;color:#4E5F78}

  /* ================= 하늘(대기·진행) ================= */
  #vSky{justify-content:space-between}
  .sky-head{flex:none;text-align:center;padding:2px 0 0}
  .phase-pill{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;letter-spacing:.1em;
    color:var(--gold2);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.34);
    padding:5px 12px;border-radius:99px;margin-bottom:8px;
  }
  .phase-pill .blink{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:pulse 1.1s infinite}
  .myid{font-size:12px;font-weight:800;color:#93A4BC;letter-spacing:-.01em}
  .myid b{color:#E8EEF8;font-size:14px;font-weight:900}

  .sky-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;padding:4px 0}
  .balloon-wrap{position:relative;width:100%;display:flex;align-items:center;justify-content:center}
  .balloon-wrap::before{content:"";position:absolute;width:min(82vw,330px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle, rgba(251,191,36,.20), rgba(251,191,36,0) 66%);filter:blur(4px);z-index:0}
  .balloon-wrap.float{animation:floaty 3.6s ease-in-out infinite}
  .balloon-wrap.rise{animation:lift 1.5s cubic-bezier(.22,.9,.28,1) both}
  .balloon-wrap.pop{animation:popOut .5s ease forwards}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.4deg)}50%{transform:translateY(-13px) rotate(1.4deg)}}
  @keyframes lift{from{transform:translateY(70px) scale(.92);opacity:.2}to{transform:none;opacity:1}}
  @keyframes popOut{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(.72);opacity:0}}
  #balloonSvg{position:relative;z-index:1;width:min(64vw,246px);height:auto;display:block;filter:drop-shadow(0 26px 32px rgba(0,0,0,.55))}
  .burst{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:76px;
    filter:drop-shadow(0 14px 26px rgba(0,0,0,.6));
  }
  .burst.on{display:flex;animation:burstIn .62s cubic-bezier(.18,1.4,.4,1) both}
  @keyframes burstIn{0%{transform:scale(.2);opacity:0}45%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
  .shards{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .shard{position:absolute;width:9px;height:13px;border-radius:3px;opacity:0}
  .shake{animation:shakeY .5s ease}
  @keyframes shakeY{0%,100%{transform:none}15%{transform:translate(-7px,4px)}32%{transform:translate(6px,-5px)}50%{transform:translate(-5px,3px)}68%{transform:translate(4px,-2px)}84%{transform:translate(-2px,1px)}}

  .status{text-align:center;padding:4px 6px 0}
  .status .big{font-size:19px;font-weight:900;letter-spacing:-.035em;line-height:1.35;margin:0 0 5px}
  .status .sm{font-size:12.5px;font-weight:700;color:#8B9CB5;margin:0;min-height:18px}
  .status.pop-state .big{color:#FCA5A5}
  .status.win-state .big{color:var(--gold2)}

  .meters{flex:none;display:flex;gap:9px;margin-top:10px}
  .meter{
    flex:1;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#131F36,#0E1828);
    padding:11px 8px 10px;text-align:center;position:relative;overflow:hidden;
  }
  .meter .lb{font-size:9.5px;font-weight:900;letter-spacing:.14em;color:#7E90A9;margin-bottom:3px}
  .meter .vl{font-family:var(--mono);font-size:22px;font-weight:900;color:#EAF1FA;line-height:1.05;letter-spacing:-.02em}
  .meter .vl small{font-size:11px;font-weight:800;color:#8FA0B8;letter-spacing:0;margin-left:2px}
  .meter.hot .vl{color:var(--gold2)}
  .meter.live .vl{color:var(--mint)}
  .meter .bar{position:absolute;left:0;bottom:0;height:2.5px;width:0%;background:linear-gradient(90deg,var(--gold),#FDE68A);transition:width .18s linear}
  .bottom-hint{flex:none;text-align:center;font-size:11px;font-weight:700;color:#5D6E88;padding-top:11px;letter-spacing:-.01em}
  .bottom-hint b{color:#93A4BC;font-weight:800}

  /* ================= 우승 ================= */
  #win{
    position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px;
    background:
      radial-gradient(80% 60% at 50% 40%, rgba(251,191,36,.30), rgba(8,14,27,.96) 68%),
      linear-gradient(180deg,rgba(12,21,38,.97),rgba(6,11,22,.99));
  }
  #win.on{display:flex;animation:winIn .6s ease both}
  @keyframes winIn{from{opacity:0}to{opacity:1}}
  .crown{font-size:64px;line-height:1;animation:crownUp 2.6s ease-in-out infinite;filter:drop-shadow(0 12px 26px rgba(251,191,36,.5))}
  @keyframes crownUp{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
  .win-kicker{margin-top:16px;font-size:11px;font-weight:900;letter-spacing:.28em;color:var(--gold);opacity:.95}
  .win-title{
    font-family:var(--serif);font-size:33px;font-weight:900;letter-spacing:-.05em;line-height:1.26;margin:10px 0 0;
    background:linear-gradient(180deg,#FFF7DB,#FBBF24 62%,#F59E0B);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .win-name{
    margin-top:16px;font-size:20px;font-weight:900;letter-spacing:-.02em;color:#0B1220;
    background:linear-gradient(180deg,#FDE68A,#FBBF24);padding:9px 22px;border-radius:99px;
    box-shadow:0 16px 34px -18px rgba(251,191,36,.9);
  }
  .win-sub{margin-top:16px;font-size:13px;font-weight:700;color:#B9C6D8;line-height:1.6}
  .win-sub b{color:var(--gold2)}
  .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall linear infinite}
  @keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(620deg)}}

  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translate(-50%,16px);
    max-width:min(92vw,380px);background:rgba(17,27,45,.97);border:1px solid var(--line2);color:#E8EEF8;
    font-size:12.5px;font-weight:800;line-height:1.45;padding:11px 16px;border-radius:13px;
    box-shadow:0 18px 40px -20px rgba(0,0,0,.95);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:30;
    text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ── 채널 CTA : 강연 크리에이터 · 정진영 ── */
  .ctaHub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;
    margin-top:16px;width:100%;flex:0 0 auto}
  @media (min-width:600px){.ctaHub{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .ctaHub a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:11px 6px;
    border-radius:13px;box-sizing:border-box;font-family:inherit;font-size:12.5px;font-weight:800;
    letter-spacing:-.02em;line-height:1.15;color:#EAF1FA;text-decoration:none;white-space:nowrap;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    -webkit-tap-highlight-color:transparent;transition:transform .12s ease,filter .2s ease}
  .ctaHub a:active{transform:scale(.97);filter:brightness(1.14)}
  .ctaHub a .ci{font-size:14px;line-height:1}
  .ctaHub a.hot{color:#11150C;background:var(--hubhot,#FFD24A);border-color:transparent;font-weight:900}
  .ctaHub a.book{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.24)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="b">🎈</span><span class="txt">오늘은 내가 주인공</span></div>
    <div class="roomchip">방 <b id="roomTag">JY99</b></div>
  </div>

  <div class="views">
    <!-- ============ 입장 ============ -->
    <section class="view on" id="vEntry">
      <div class="entry-card">
        <div class="kicker">강연 크리에이터 · 정진영</div>
        <h1>오늘은 <em>내가 주인공</em></h1>
        <p class="esub">포수가 쏘는 풍선을 피해<br><b>끝까지 살아남는 사람</b>이 오늘의 주인공!</p>
        <div class="field">
          <label for="roomInput">방 코드</label>
          <input class="inp room" id="roomInput" value="JY99" maxlength="8" inputmode="text" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="nameInput">내 이름 (아이디)</label>
          <input class="inp" id="nameInput" maxlength="10" placeholder="예: 정진영" autocomplete="off" spellcheck="false">
        </div>
        <button class="joinbtn" id="joinBtn">입장하기</button>
        <div class="entry-foot"><span class="dot"></span><span>현재 <b id="entryCount">0</b> / 99명 입장 <i>· 최대 99명</i></span></div>
      </div>
    </section>

    <!-- ============ 하늘 ============ -->
    <section class="view" id="vSky">
      <div class="sky-head">
        <div class="phase-pill"><span class="blink"></span><span id="phaseTxt">대기 중</span></div>
        <div class="myid">내 풍선 · <b id="myName">참가자</b></div>
      </div>

      <div class="sky-stage">
        <div class="balloon-wrap float" id="balloonWrap">
          <svg id="balloonSvg" viewBox="0 0 240 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="bg1" cx="35%" cy="26%" r="78%">
                <stop offset="0%" stop-color="#fff" stop-opacity=".92"/>
                <stop offset="34%" stop-color="#fff" stop-opacity=".32"/>
                <stop offset="100%" stop-color="#000" stop-opacity=".18"/>
              </radialGradient>
              <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FF7A7A"/>
                <stop offset="52%" stop-color="#FF5B5B"/>
                <stop offset="100%" stop-color="#D93B3B"/>
              </linearGradient>
              <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="7"/>
              </filter>
            </defs>
            <ellipse cx="120" cy="300" rx="52" ry="12" fill="#000" opacity=".22" filter="url(#soft)"/>
            <path id="stringPath" d="M120 232 C 108 254, 132 268, 118 292" fill="none" stroke="#C9D6E8" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round"/>
            <path id="knot" d="M120 226 L 132 240 L 108 240 Z" fill="#D93B3B"/>
            <ellipse id="body" cx="120" cy="118" rx="92" ry="110" fill="url(#bg2)"/>
            <ellipse cx="120" cy="118" rx="92" ry="110" fill="url(#bg1)"/>
            <ellipse cx="84" cy="72" rx="21" ry="30" fill="#fff" opacity=".42" transform="rotate(-22 84 72)"/>
            <ellipse cx="150" cy="178" rx="15" ry="20" fill="#000" opacity=".08"/>
            <text id="balloonName" x="120" y="124" text-anchor="middle" dominant-baseline="middle"
                  font-family="Pretendard Variable,Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900"
                  fill="#fff" style="paint-order:stroke" stroke="rgba(0,0,0,.32)" stroke-width="4">내 이름</text>
          </svg>
          <div class="burst" id="burst">💥</div>
          <div class="shards" id="shards"></div>
        </div>
        <div class="status" id="statusBox">
          <p class="big" id="statusBig">🎈 내 풍선이 하늘로 올라가는 중...</p>
          <p class="sm" id="statusSm">곧 시작합니다</p>
        </div>
      </div>

      <div class="meters">
        <div class="meter hot" id="mAlive">
          <div class="lb">생존 풍선</div>
          <div class="vl"><span id="aliveN">0</span><small>개</small></div>
        </div>
        <div class="meter live" id="mTime">
          <div class="lb">남은 시간</div>
          <div class="vl"><span id="timeN">26</span><small>초</small></div>
          <div class="bar" id="timeBar"></div>
        </div>
      </div>
      <div class="bottom-hint" id="bottomHint">끝까지 살아남으면 <b>오늘의 주인공</b>!</div>
    </section>

    <!-- ============ 우승 ============ -->
    <div id="win">
      <div class="confetti" id="confetti"></div>
      <div class="crown">👑</div>
      <div class="win-kicker">TODAY'S HERO</div>
      <div class="win-title">오늘은<br>내가 주인공!</div>
      <div class="win-name" id="winName">참가자</div>
      <div class="win-sub">포수를 모두 피해냈습니다.<br>가장 <b>운 좋은 주인공</b>은 바로 당신!</div>
      <div class="ctaHub" style="--hubhot:var(--gold2)" aria-label="정진영 채널 바로가기">
        <a href="https://www.instagram.com/_j_jin0/" target="_blank" rel="noopener noreferrer"><span class="ci" aria-hidden="true">📸</span>인스타</a>
        <a href="https://www.threads.com/@_j_jin0" target="_blank" rel="noopener noreferrer"><span class="ci" aria-hidden="true">🧵</span>스레드</a>
        <a class="hot" href="https://jungjinyoung3512.github.io/jungjinyoung3512/#contact" target="_blank" rel="noopener noreferrer"><span class="ci" aria-hidden="true">🌙</span>1월 리셋밤</a>
        <a class="book" href="https://kmong.com/gig/536319" target="_blank" rel="noopener noreferrer"><span class="ci" aria-hidden="true">📘</span>책 보러가기</a>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);

  /* ================= 설정 ================= */
  const QS = new URLSearchParams(location.search);
  const DEFAULT_ROOM = "JY99";
  const normRoom = v => String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  let ROOM = normRoom(QS.get("room")) || DEFAULT_ROOM;

  const FB_CONFIG = {
    apiKey: "AIzaSyATHgKSeMI0Xmw1sC01FuQXbnXeS9zkTYA",
    authDomain: "jy-run-100m.firebaseapp.com",
    databaseURL: "https://jy-run-100m-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "jy-run-100m",
    storageBucket: "jy-run-100m.firebasestorage.app",
    messagingSenderId: "977342156141",
    appId: "1:977342156141:web:f9842fcc67a819ce621e64"
  };

  const CAP = 99;       /* 정원 */
  const DUR_DEFAULT = 26;
  const DUR_ALLOWED = [26, 16];

  const COLORS = ["#FF6B6B","#FFA94D","#FFD43B","#69DB7C","#38D9A9","#4DABF7","#9775FA","#F783AC","#FF922B","#63E6BE","#F06595","#74C0FC"];

  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : v; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} },
    del(k){ try{ localStorage.removeItem(k); }catch(e){} }
  };

  let pid = store.get("hb_pid", "");
  if (!pid || pid.length < 6){
    pid = "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    store.set("hb_pid", pid);
  }

  const G = {
    joined:false, name:"", color:COLORS[0], joinedAt:0,
    phase:"idle", startAt:0, gameId:0, k:0, durationSec:DUR_DEFAULT,
    pops:{}, popped:{}, survivors:{}, total:0,
    offset:0, raf:0, screen:"entry",
    myPopAt:0, isPopped:false, isAlive:true, winShown:false, joinedCount:0,
    lastCd:"", poppedAtMs:0
  };

  const serverNow = () => Date.now() + G.offset;
  const gameMs = () => (DUR_ALLOWED.indexOf(G.durationSec) >= 0 ? G.durationSec : DUR_DEFAULT) * 1000;
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function toast(msg, ms){
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("on"), ms || 2600);
  }

  function show(name){
    G.screen = name;
    $("vEntry").classList.toggle("on", name === "entry");
    $("vSky").classList.toggle("on", name === "sky");
    document.body.classList.toggle("live", name === "sky");
    if (name !== "sky") hideWin();
  }

  /* ================= 입장 화면 ================= */
  $("roomTag").textContent = ROOM;
  $("roomInput").value = ROOM;
  $("nameInput").value = store.get("hb_name", "");

  /* ================= Firebase ================= */
  const FB = {db:null, base:"", ok:false};
  let metaRef = null, playersRef = null, meRef = null;

  function initFirebase(){
    if (typeof firebase === "undefined" || !firebase.initializeApp){
      toast("연결에 실패했어요. 새로고침 해 주세요.", 4000);
      return;
    }
    try{
      firebase.initializeApp(FB_CONFIG);
      FB.db = firebase.database();
      FB.ok = true;
      FB.db.ref(".info/serverTimeOffset").on("value", s => { G.offset = s.val() || 0; });
      bindRoom();
    }catch(e){
      toast("연결에 실패했어요. 새로고침 해 주세요.", 4000);
    }
  }

  function bindRoom(){
    if (metaRef) metaRef.off();
    if (playersRef) playersRef.off();
    if (meRef) meRef.off();

    FB.base = "rooms/heroBalloon/" + ROOM;
    metaRef = FB.db.ref(FB.base + "/meta");
    playersRef = FB.db.ref(FB.base + "/players");
    meRef = FB.db.ref(FB.base + "/players/" + pid);

    metaRef.on("value", s => onMeta(s.val() || {}));
    playersRef.on("value", s => onPlayers(s.val() || {}));
    meRef.on("value", s => {
      const v = s.val();
      if (!v && G.joined) kickOut();
    });
  }

  function kickOut(){
    G.joined = false;
    store.del("hb_joined");
    hideWin();
    resetBalloon();
    show("entry");
    toast("선생님이 참가자를 정리했어요. 다시 입장해 주세요.", 3400);
  }

  /* ================= 상태 반영 ================= */
  function onMeta(m){
    const prevId = G.gameId;
    G.phase = m.status || "idle";
    G.startAt = Number(m.startAt) || 0;
    G.gameId = Number(m.gameId) || 0;
    G.k = Number(m.k) || 0;
    G.pops = m.pops || {};
    G.popped = m.popped || {};
    G.survivors = m.survivors || {};
    G.total = Number(m.total) || 0;
    /* 진행자가 고른 게임 길이 (26초 / 16초) */
    const ds = Number(m.durationSec);
    if (DUR_ALLOWED.indexOf(ds) >= 0) G.durationSec = ds;

    if (G.gameId !== prevId && G.gameId > 0){
      hideWin();
      resetBalloon();
      G.winShown = false;
      G.poppedAtMs = 0;
    }
    evaluateMyState();
    syncView();
  }

  function onPlayers(p){
    const n = Object.keys(p || {}).length;
    G.joinedCount = n;
    $("entryCount").textContent = String(Math.min(n, CAP));
    if (G.phase === "idle" && G.screen === "sky" && !G.isPopped){
      $("aliveN").textContent = String(n);
    }
    if (!G.joined){
      const me = (p || {})[pid];
      if (me) { G.joined = true; G.name = me.name || G.name; G.color = me.color || G.color; }
    }
  }

  /* 내 풍선 상태 계산 */
  function evaluateMyState(){
    if (!G.joined) return;
    const myPop = G.pops[pid];
    G.myPopAt = myPop ? Number(myPop) : 0;

    const poppedVal = G.popped[pid];
    const nowMs = serverNow();

    let alive = true;
    if (poppedVal) alive = false;
    else if (G.myPopAt && nowMs >= G.myPopAt) alive = false;

    if (G.phase === "idle"){
      alive = true;
      G.isPopped = false;
      G.isAlive = true;
      return;
    }
    if (!alive && !G.isPopped){
      doPop(poppedVal ? Number(poppedVal) : G.myPopAt);
    } else if (alive){
      G.isAlive = true;
    }
  }

  function surviveCount(){
    const nowMs = serverNow();
    let n = 0;
    const total = G.total || 0;
    let popped = 0;
    for (const k in G.pops){
      if (Number(G.pops[k]) <= nowMs) popped++;
    }
    for (const k in G.popped){ if (!(k in G.pops)) popped++; }
    n = Math.max(0, total - popped);
    return n;
  }

  /* ================= 화면 동기화 ================= */
  function syncView(){
    if (!G.joined){
      if (G.screen !== "entry") show("entry");
      return;
    }
    if (G.phase === "idle"){
      if (G.screen !== "sky") show("sky");
      hideWin();
      resetBalloon();
      setPhase("대기 중");
      setStatus("🎈 내 풍선이 하늘로 올라가는 중...", "곧 시작합니다 · 진행자의 시작을 기다려 주세요");
      $("mTime").querySelector(".lb").textContent = "게임 길이";
      $("mAlive").querySelector(".lb").textContent = "대기 참가자";
      $("timeN").textContent = String(G.durationSec);
      $("timeBar").style.width = "0%";
      $("aliveN").textContent = String(G.joinedCount || 0);
      $("bottomHint").innerHTML = "끝까지 살아남으면 <b>오늘의 주인공</b>!";
      return;
    }
    if (G.phase === "countdown" || G.phase === "running"){
      if (G.screen !== "sky") show("sky");
      startLoop();
      return;
    }
    if (G.phase === "ended"){
      if (G.screen !== "sky") show("sky");
      stopLoop();
      endedView();
      return;
    }
    if (G.phase === "finished"){
      if (G.screen !== "sky") show("sky");
      stopLoop();
      finishView();
    }
  }

  function setPhase(t){ $("phaseTxt").textContent = t; }

  function setStatus(big, sm, cls){
    $("statusBig").textContent = big;
    $("statusSm").textContent = sm || "";
    const box = $("statusBox");
    box.classList.remove("pop-state", "win-state");
    if (cls) box.classList.add(cls);
  }

  function resetBalloon(){
    G.isPopped = false;
    G.isAlive = true;
    $("balloonWrap").classList.remove("pop", "rise");
    $("balloonWrap").classList.add("float");
    $("balloonWrap").style.opacity = "";
    $("burst").classList.remove("on");
    $("shards").innerHTML = "";
    document.body.classList.remove("shake");
  }

  function doPop(atMs){
    G.isPopped = true;
    G.isAlive = false;
    G.poppedAtMs = atMs || 0;
    $("balloonWrap").classList.remove("float", "rise");
    $("balloonWrap").classList.add("pop");
    $("burst").classList.add("on");
    document.body.classList.add("shake");
    setTimeout(() => document.body.classList.remove("shake"), 560);
    spawnShards();
    if (navigator.vibrate){ try{ navigator.vibrate([40, 60, 40]); }catch(e){} }
    setStatus("💥 아쉽지만 내 풍선이 터졌어요!", "다음 판에서 다시 도전! 결과 발표를 기다려 주세요", "pop-state");
    $("bottomHint").innerHTML = "포수에게 잡혔습니다 · <b>다음엔 주인공!</b>";
  }

  function spawnShards(){
    const wrap = $("shards");
    wrap.innerHTML = "";
    const cols = ["#FF6B6B","#FFD43B","#4DABF7","#69DB7C","#fff"];
    for (let i = 0; i < 14; i++){
      const s = document.createElement("i");
      s.className = "shard";
      const ang = (Math.PI * 2 * i) / 14 + Math.random() * 0.4;
      const dist = 70 + Math.random() * 74;
      s.style.background = cols[i % cols.length];
      s.style.left = "50%";
      s.style.top = "42%";
      s.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "px");
      s.style.setProperty("--dy", (Math.sin(ang) * dist - 30).toFixed(1) + "px");
      s.style.animation = "shardFly " + (720 + Math.random() * 260).toFixed(0) + "ms cubic-bezier(.2,.7,.3,1) forwards";
      s.style.animationDelay = (i * 12) + "ms";
      wrap.appendChild(s);
    }
  }
  /* 샤드 키프레임 (동적 주입) */
  const st = document.createElement("style");
  st.textContent = "@keyframes shardFly{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.5) rotate(300deg)}}";
  document.head.appendChild(st);

  /* ================= 진행 루프 ================= */
  function startLoop(){
    if (G.raf) return;
    const tick = () => {
      G.raf = requestAnimationFrame(tick);
      paintLive();
    };
    G.raf = requestAnimationFrame(tick);
  }
  function stopLoop(){
    if (G.raf){ cancelAnimationFrame(G.raf); G.raf = 0; }
  }

  function paintLive(){
    const now = serverNow();
    if (G.phase === "countdown"){
      const cd = Math.max(0, G.startAt - now);
      const n = Math.ceil(cd / 1000);
      setPhase("준비 중");
      if (String(n) !== G.lastCd){
        G.lastCd = String(n);
        setStatus("🎈 풍선이 올라갑니다...", n > 0 ? n + "초 뒤 출발!" : "출발!");
      }
      $("timeN").textContent = String(G.durationSec);
      $("timeBar").style.width = "0%";
      $("aliveN").textContent = String(G.total || 0);
      evaluateMyState();
      return;
    }
    if (G.phase !== "running") return;

    const el = now - G.startAt;
    const totalMs = gameMs();
    const remain = Math.max(0, totalMs - el);
    $("mTime").querySelector(".lb").textContent = "남은 시간";
    $("mAlive").querySelector(".lb").textContent = "생존 풍선";
    $("timeN").textContent = String(Math.ceil(remain / 1000));
    $("timeBar").style.width = (100 - (remain / totalMs) * 100).toFixed(1) + "%";
    $("aliveN").textContent = String(surviveCount());
    if (!G.isPopped){
      const n = surviveCount();
      setPhase("서바이벌");
      if (!G.isPopped){
        setStatus("🎈 내 풍선이 하늘로 올라가는 중...", "생존 " + n + "명 · 아직 살아 있습니다!");
        if (!$("balloonWrap").classList.contains("rise")){
          $("balloonWrap").classList.remove("float");
          $("balloonWrap").classList.add("rise");
        }
      }
    } else {
      setPhase("탈락");
    }
    evaluateMyState();
  }

  function inThisGame(){
    return !!(G.survivors[pid] || G.pops[pid] || G.popped[pid]);
  }

  function endedView(){
    evaluateMyState();
    if (!inThisGame()){
      setPhase("다음 판 대기");
      setStatus("⏳ 이번 판에는 참여하지 못했어요", "다음 판부터 도전할 수 있습니다");
      $("timeN").textContent = "0";
      $("aliveN").textContent = String(G.k || 0);
      return;
    }
    $("mAlive").querySelector(".lb").textContent = "생존 풍선";
    $("mTime").querySelector(".lb").textContent = "남은 시간";
    $("timeN").textContent = "0";
    $("timeBar").style.width = "100%";
    $("aliveN").textContent = String(G.k || Object.keys(G.survivors).length || 0);
    if (G.isPopped){
      setPhase("결과 대기 중");
      setStatus("💥 내 풍선은 터졌어요", "⏱️ 서바이벌 종료 · 결과 발표를 기다리는 중...", "pop-state");
      $("bottomHint").innerHTML = "오늘의 주인공은 <b>진행자 화면</b>에서 공개됩니다";
    } else {
      setPhase("결과 대기 중");
      setStatus("⏱️ 서바이벌 종료! 결과 발표를 기다리는 중...", "🎈 아직 살아남았습니다 · 주인공 발표를 기다려 주세요", "win-state");
      $("bottomHint").innerHTML = "끝까지 살아남았습니다 · <b>결과 발표 대기 중</b>";
    }
  }

  function finishView(){
    if (!inThisGame()){
      setPhase("다음 판 대기");
      setStatus("⏳ 이번 판에는 참여하지 못했어요", "재시작 후 다음 판에 도전해 주세요");
      $("timeN").textContent = "0";
      $("aliveN").textContent = String(G.k || 0);
      return;
    }
    const survived = G.joined && !G.isPopped && (G.survivors[pid] || (!G.myPopAt && G.phase === "finished"));
    if (G.isPopped){
      setStatus("💥 내 풍선은 터졌어요", "오늘의 주인공 발표를 화면에서 확인해 주세요", "pop-state");
      setPhase("종료");
      $("aliveN").textContent = String(G.k || Object.keys(G.survivors).length || 0);
      $("timeN").textContent = "0";
      $("timeBar").style.width = "100%";
      return;
    }
    if (survived){
      G.isAlive = true;
      setPhase("주인공");
      setStatus("🎉 축하합니다! 오늘의 주인공!!", "포수를 모두 피해냈습니다", "win-state");
      $("aliveN").textContent = String(Object.keys(G.survivors).length || 1);
      $("timeN").textContent = "0";
      $("timeBar").style.width = "100%";
      $("bottomHint").innerHTML = "<b>오늘의 주인공</b>이 바로 당신입니다!";
      showWin();
    } else {
      setStatus("🎈 아쉽게 놓쳤어요", "오늘의 주인공을 함께 축하해 주세요");
      setPhase("종료");
    }
  }

  /* ================= 우승 연출 ================= */
  function showWin(){
    if (G.winShown) return;
    G.winShown = true;
    $("winName").textContent = G.name || "참가자";
    const cf = $("confetti");
    cf.innerHTML = "";
    const cols = ["#FBBF24","#FDE68A","#F472B6","#4DABF7","#34D399","#fff"];
    for (let i = 0; i < 26; i++){
      const s = document.createElement("i");
      s.style.left = (Math.random() * 100).toFixed(1) + "%";
      s.style.background = cols[i % cols.length];
      s.style.animationDuration = (2.6 + Math.random() * 2.4).toFixed(2) + "s";
      s.style.animationDelay = (Math.random() * 2.4).toFixed(2) + "s";
      s.style.opacity = (0.6 + Math.random() * 0.4).toFixed(2);
      cf.appendChild(s);
    }
    $("win").classList.add("on");
    if (navigator.vibrate){ try{ navigator.vibrate([30, 50, 30, 50, 90]); }catch(e){} }
  }
  function hideWin(){
    $("win").classList.remove("on");
    G.winShown = false;
  }

  /* ================= 입장 ================= */
  function join(){
    const name = ($("nameInput").value || "").trim().replace(/\s+/g, " ").slice(0, 10);
    const room = normRoom($("roomInput").value) || DEFAULT_ROOM;
    if (!name){
      $("nameInput").classList.add("shake");
      setTimeout(() => $("nameInput").classList.remove("shake"), 400);
      $("nameInput").focus();
      return;
    }
    if (room !== ROOM){
      ROOM = room;
      $("roomTag").textContent = ROOM;
      $("roomInput").value = ROOM;
      bindRoom();
    }
    if (!FB.ok){ toast("연결 중입니다. 잠시 후 다시 눌러 주세요.", 2200); return; }

    const btn = $("joinBtn");
    btn.disabled = true;

    FB.db.ref(FB.base + "/players").once("value").then(snap => {
      const p = snap.val() || {};
      const n = Object.keys(p).length;
      if (!p[pid] && n >= CAP){
        btn.disabled = false;
        toast("정원이 가득 찼어요 (최대 99명)", 3000);
        return;
      }
      G.name = name;
      G.color = COLORS[Math.abs(hash(pid + name)) % COLORS.length];
      G.joinedAt = serverNow();
      const payload = { name: name, color: G.color, joinedAt: G.joinedAt };
      return FB.db.ref(FB.base + "/players/" + pid).set(payload).then(() => {
        G.joined = true;
        store.set("hb_name", name);
        btn.disabled = false;
        paintName();
        if (G.phase === "idle"){
          show("sky");
          syncView();
        } else if (G.phase === "finished"){
          show("sky");
          finishView();
        } else {
          show("sky");
          toast("지금은 게임이 진행 중이에요. 다음 판부터 참여할 수 있어요.", 3000);
          setStatus("⏳ 게임이 진행 중입니다", "다음 판부터 참여할 수 있어요");
        }
      });
    }).catch(() => {
      btn.disabled = false;
      toast("입장에 실패했어요. 다시 눌러 주세요.", 3000);
    });
  }

  function hash(s){
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return h;
  }

  function paintName(){
    const nm = G.name || "참가자";
    $("myName").textContent = nm;
    $("winName").textContent = nm;
    const t = $("balloonName");
    t.textContent = nm;
    /* 이름 길이에 맞춰 폰트 크기·말줄임 조절 */
    let fs = 30;
    t.setAttribute("font-size", String(fs));
    let w = 0;
    try{ w = t.getComputedTextLength(); }catch(e){ w = nm.length * fs * 0.95; }
    const maxW = 128;
    if (w > maxW){
      fs = Math.max(15, Math.floor(fs * maxW / w));
      t.setAttribute("font-size", String(fs));
      try{ w = t.getComputedTextLength(); }catch(e){}
    }
    if (w > maxW){
      let s = nm;
      while (s.length > 1 && w > maxW){
        s = s.slice(0, -1);
        t.textContent = s + "…";
        try{ w = t.getComputedTextLength(); }catch(e){ break; }
      }
    }
    $("balloonWrap").style.filter = "drop-shadow(0 20px 34px rgba(0,0,0,.5))";
    const g = document.querySelector("#bg2");
    if (g){
      const c = G.color;
      g.innerHTML = '<stop offset="0%" stop-color="' + shade(c, 46) + '"/>'
                  + '<stop offset="52%" stop-color="' + c + '"/>'
                  + '<stop offset="100%" stop-color="' + shade(c, -34) + '"/>';
    }
    const knot = $("knot"); if (knot) knot.setAttribute("fill", shade(G.color || "#FF5B5B", -34));
  }

  function shade(hex, amt){
    const h = String(hex || "#FF5B5B").replace("#", "");
    const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
    let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  $("joinBtn").addEventListener("click", join);
  $("nameInput").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); join(); } });
  $("roomInput").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); join(); } });

  /* 화면 복귀 시 상태 재계산 */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible"){
      evaluateMyState();
      syncView();
    }
  });

  initFirebase();
})();
</script>
